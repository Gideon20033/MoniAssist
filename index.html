<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoniAssist</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    background:linear-gradient(135deg,#0057ff,#00b4ff);

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}



.container{

    width:90%;

    max-width:380px;

    background:#fff;

    border-radius:20px;

    padding:35px 25px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.2);

}



.logo{

    width:90px;

    height:90px;

    background:#0057ff;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    color:#fff;

    font-size:38px;

}



h1{

    margin-top:20px;

    color:#0057ff;

}



p{

    color:#666;

    margin:15px 0 30px;

    line-height:1.6;

}



.btn{

    display:block;

    text-decoration:none;

    padding:15px;

    margin-bottom:15px;

    border-radius:12px;

    font-size:17px;

    font-weight:bold;

}



.register{

    background:#0057ff;

    color:white;

}



.login{

    background:#f2f2f2;

    color:#0057ff;

    border:2px solid #0057ff;

}



.admin{

    background:#111;

    color:white;

}



footer{

    margin-top:25px;

    color:#888;

    font-size:13px;

}


</style>


</head>


<body>


<div class="container">


<div class="logo">

<i class="fas fa-wallet"></i>

</div>



<h1>MoniAssist</h1>


<p>
Welcome to MoniAssist.<br>
Create an account or login to continue.
</p>



<a href="register.html" class="btn register">
Create Account
</a>



<a href="login.html" class="btn login">
User Login
</a>



<a href="admin-login.html" class="btn admin">
Admin Login
</a>



<footer>

© 2026 MoniAssist. All Rights Reserved.

</footer>


</div>


</body>
</html>
