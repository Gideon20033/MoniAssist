<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - MoniAssist</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f8ff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:400px;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.logo{
text-align:center;
font-size:45px;
color:#0057ff;
margin-bottom:10px;
}

h2{
text-align:center;
color:#0057ff;
margin-bottom:20px;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:bold;
}

.input-group input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
outline:none;
}

.input-group input:focus{
border-color:#0057ff;
}

button{
width:100%;
padding:14px;
background:#0057ff;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0045cc;
}

.bottom{
margin-top:20px;
text-align:center;
}

.bottom a{
text-decoration:none;
color:#0057ff;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">
<i class="fas fa-wallet"></i>
</div>

<h2>Create Account</h2>

<form id="registerForm">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your full name" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="08012345678" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" placeholder="example@gmail.com" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Create password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm password" required>
</div>

<button type="submit">
Create Account
</button>

<div class="bottom">
Already have an account?
<a href="login.html">Login</a>
</div>

</form>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("registerForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match!");
    return;
  }

  try {

  const userCredential = await createUserWithEmailAndPassword(
    auth,
    email,
    password
  );

  const user = userCredential.user;

  // Generate an 8-digit account number
  const accountNumber = "10" + Math.floor(100000 + Math.random() * 900000);

  await setDoc(doc(db, "users", user.uid), {
    Name: name,
    Phone: phone,
    Email: email,
    Role: "User",
    Balance: 0,
    Accountnumber: accountNumber,
    Creatdat: serverTimestamp()
  });

  alert("Account created successfully!");

  window.location.assign("./dashboard.html");

} catch (error) {
  alert(error.message);
}

});

</script>
</body>
  </html>
