<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Deposits - MoniAssist</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f8ff;
}


.header{

    background:#0057ff;
    color:white;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;

}


.header a{

    color:white;
    text-decoration:none;
    font-size:22px;

}


.container{

    width:92%;
    max-width:500px;
    margin:25px auto;

}


.title{

    text-align:center;
    color:#0057ff;
    margin-bottom:20px;

}


.deposit-card{

    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.deposit-card p{

    margin:8px 0;

}


.status{

    color:#ff9800;
    font-weight:bold;

}


button{

    width:48%;
    padding:12px;
    border:none;
    border-radius:10px;
    color:white;
    font-weight:bold;
    margin-top:15px;

}


.approve{

    background:#0057ff;

}


.reject{

    background:red;

}


.actions{

    display:flex;
    justify-content:space-between;

}



.empty{

    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    color:#777;

}

</style>

</head>


<body>


<div class="header">

<a href="admin.html">

<i class="fas fa-arrow-left"></i>

</a>

<h2>Deposit Requests</h2>

</div>



<div class="container">


<h2 class="title">
Pending Deposits
</h2>


<div id="depositList">

<div class="empty">

Loading deposits...

</div>


</div>



</div>



<script type="module" src="admin-deposits.js"></script>


</body>

</html>
