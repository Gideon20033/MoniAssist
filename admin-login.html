<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoniAssist Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0057ff,#00b4ff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
width:90%;
max-width:360px;
padding:30px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#0057ff;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

input:focus{
border-color:#0057ff;
}

button{
width:100%;
padding:14px;
background:#0057ff;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0045cc;
}

#message{
margin-top:15px;
text-align:center;
color:red;
font-size:14px;
}

</style>

</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<p id="message"></p>

</div>

<script type="module" src="admin-login.js"></script>

</body>
  </html>
