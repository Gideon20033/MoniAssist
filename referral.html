<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Referral - MoniAssist</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#f5f8ff;
}



/* Header */

.header{

    background:#0057ff;
    color:white;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;

}


.header a{

    color:white;
    text-decoration:none;
    font-size:22px;

}


.header h2{

    color:white;
    font-size:20px;

}



/* Container */

.container{

    width:92%;
    max-width:420px;
    margin:25px auto;

}



/* Cards */

.card{

    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);

}



.card h2{

    color:#0057ff;
    text-align:center;
    margin-bottom:15px;

}



/* Referral Icon */

.referral-icon{

    width:80px;
    height:80px;
    border-radius:50%;
    background:#e8f0ff;
    color:#0057ff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    margin:0 auto 15px;

}



.text{

    text-align:center;
    color:#555;
    line-height:1.5;

}



/* Referral Link */

.link-box{

    background:#f5f8ff;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    text-align:center;

}



button{

    width:100%;
    margin-top:15px;
    padding:14px;
    background:#0057ff;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;

}



/* Stats */

.stats{

    display:flex;
    justify-content:space-between;
    gap:10px;

}



.stat{

    flex:1;
    background:#e8f0ff;
    padding:15px;
    border-radius:15px;
    text-align:center;

}



.stat h3{

    color:#0057ff;

}


.stat p{

    margin-top:5px;

}



/* Bottom Navigation */

.bottom-nav{

    position:fixed;
    bottom:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:15px;
    box-shadow:0 -2px 10px #ddd;

}



.bottom-nav a{

    color:#0057ff;
    text-decoration:none;
    text-align:center;
    font-size:13px;

}



.bottom-nav i{

    display:block;
    font-size:20px;
    margin-bottom:5px;

}


</style>


</head>



<body>



<div class="header">


<a href="dashboard.html">

<i class="fas fa-arrow-left"></i>

</a>


<h2>Referral</h2>


</div>




<div class="container">



<div class="card">


<div class="referral-icon">

<i class="fas fa-users"></i>

</div>



<h2>Invite Friends</h2>


<p class="text">

Invite your friends to join MoniAssist and earn referral rewards.

</p>



<div class="link-box">

Your referral link

<br><br>

MoniAssist/referral

</div>



<button>

Copy Referral Link

</button>



</div>





<div class="card">


<h2>Your Referral Stats</h2>


<div class="stats">


<div class="stat">

<h3>0</h3>

<p>Friends</p>

</div>



<div class="stat">

<h3>₦0</h3>

<p>Bonus</p>

</div>



</div>


</div>



</div>




<div class="bottom-nav">


<a href="dashboard.html">

<i class="fas fa-home"></i>

Home

</a>



<a href="history.html">

<i class="fas fa-clock"></i>

History

</a>



<a href="settings.html">

<i class="fas fa-user"></i>

Settings

</a>


</div>




</body>

</html>
