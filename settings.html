<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings - MoniAssist</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f8ff;
}


/* Header */

.header{

    background:#0057ff;
    color:white;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;

}

.header a{

    color:white;
    text-decoration:none;
    font-size:22px;

}

.header h2{

    color:white;
    font-size:20px;

}



/* Container */

.container{

    width:92%;
    max-width:420px;
    margin:25px auto;

}



/* Profile */

.profile{

    background:#0057ff;
    color:white;
    padding:25px;
    border-radius:20px;
    text-align:center;
    margin-bottom:20px;

}


.profile i{

    font-size:60px;
    margin-bottom:10px;

}


.profile h3{

    margin-top:10px;

}



/* Settings Card */

.card{

    background:white;
    padding:15px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}



.item{

    display:flex;
    align-items:center;
    gap:15px;
    padding:18px 5px;
    border-bottom:1px solid #eee;

}


.item:last-child{

    border-bottom:none;

}



.item i{

    width:35px;
    height:35px;
    background:#e8f0ff;
    color:#0057ff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;

}



.item a{

    text-decoration:none;
    color:#333;
    font-size:16px;

}



.logout{

    color:red !important;

}



/* Bottom Nav */

.bottom-nav{

    position:fixed;
    bottom:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:15px;
    box-shadow:0 -2px 10px #ddd;

}


.bottom-nav a{

    color:#0057ff;
    text-decoration:none;
    text-align:center;
    font-size:13px;

}


.bottom-nav i{

    display:block;
    font-size:20px;
    margin-bottom:5px;

}


</style>


</head>


<body>


<div class="header">

<a href="dashboard.html">

<i class="fas fa-arrow-left"></i>

</a>

<h2>Settings</h2>

</div>




<div class="container">



<div class="profile">

<i class="fas fa-user-circle"></i>

<h3>MoniAssist User</h3>

<p>Account Settings</p>

</div>




<div class="card">



<div class="item">

<i class="fas fa-user"></i>

<a href="#">Profile</a>

</div>




<div class="item">

<i class="fas fa-lock"></i>

<a href="#">Change Password</a>

</div>




<div class="item">

<i class="fas fa-bell"></i>

<a href="#">Notifications</a>

</div>




<div class="item">

<i class="fas fa-headset"></i>

<a href="#">Support</a>

</div>




<div class="item">

<i class="fas fa-right-from-bracket"></i>

<a class="logout" href="login.html">Logout</a>

</div>



</div>



</div>




<div class="bottom-nav">


<a href="dashboard.html">

<i class="fas fa-home"></i>

Home

</a>



<a href="history.html">

<i class="fas fa-clock"></i>

History

</a>



<a href="referral.html">

<i class="fas fa-users"></i>

Referral

</a>


</div>




</body>

  </html>
