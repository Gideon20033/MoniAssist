<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - MoniAssist</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f8ff;
}

.header{
    background:#0057ff;
    color:white;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:20px;
}

.container{
    width:90%;
    max-width:400px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    text-align:center;
}

.card h2{
    color:#0057ff;
    margin-bottom:15px;
}

.card p{
    color:#666;
    line-height:1.6;
    margin-bottom:20px;
}

.support-box{
    margin-top:10px;
}

.support-item{
    background:#f5f8ff;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:15px;
    transition:.3s;
}

.support-item:hover{
    background:#e8f0ff;
}

.support-item i{
    color:#0057ff;
    font-size:25px;
}

.support-item a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
    width:100%;
}
</style>

</head>

<body>

<header class="header">
    <a href="dashboard.html">
        <i class="fas fa-arrow-left"></i>
    </a>

    <h2>Support</h2>
</header>

<div class="container">

    <div class="card">

        <h2>MoniAssist Community</h2>

        <p>
            Join our official Telegram community for announcements, investment updates, support, and discussions with other members.
        </p>

        <div class="support-box">

            <div class="support-item">
                <i class="fab fa-telegram"></i>
                <a href="https://t.me/+pu7PtIeoaHBjM2Q0" target="_blank">
                    Join Telegram Channel
                </a>
            </div>

            <div class="support-item">
                <i class="fab fa-telegram"></i>
                <a href="https://t.me/+pBJ7L53uT-llMDg0" target="_blank">
                    Join Telegram Group
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
