<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoniAssist Admin Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f6;
}

.header{
    background:#0066ff;
    color:white;
    padding:20px;
    text-align:center;
}

.stats{
    display:flex;
    gap:10px;
    padding:20px;
    flex-wrap:wrap;
}

.stat{
    background:white;
    padding:15px;
    border-radius:10px;
    flex:1;
    min-width:120px;
    text-align:center;
    box-shadow:0 2px 8px #ccc;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px #ccc;
}

.card a{
    text-decoration:none;
    color:#0066ff;
    font-weight:bold;
}

.logout{
    color:red !important;
}

.loading{
    color:#777;
}
</style>

</head>

<body>

<div class="header">
<h2>MoniAssist Admin</h2>
<p>Admin Control Panel</p>
</div>


<div class="stats">

<div class="stat">
<h3 id="totalUsers" class="loading">0</h3>
<p>Users</p>
</div>


<div class="stat">
<h3 id="totalDeposits" class="loading">₦0</h3>
<p>Deposits</p>
</div>


<div class="stat">
<h3 id="pendingWithdrawals" class="loading">0</h3>
<p>Pending Withdrawals</p>
</div>


<div class="stat">
<h3 id="activeInvestments" class="loading">0</h3>
<p>Investments</p>
</div>

</div>


<div class="menu">

<div class="card">
<a href="admin-dashboard.html">Dashboard</a>
</div>


<div class="card">
<a href="admin-users.html">Users</a>
</div>


<div class="card">
<a href="admin-deposits.html">Deposits</a>
</div>


<div class="card">
<a href="admin-withdrawals.html">Withdrawals</a>
</div>


<div class="card">
<a href="admin-investments.html">Investments</a>
</div>


<div class="card">
<a href="admin-transactions.html">Transactions</a>
</div>


<div class="card">
<a href="admin-settings.html">Settings</a>
</div>

<div class="card">
<a href="admin-wallet.html">Wallet / Finance</a>
</div>
    
<div class="card">
<a class="logout" href="index.html">Logout</a>
</div>

</div>


<script type="module" src="admin-dashboard.js"></script>

</body>
</html>
